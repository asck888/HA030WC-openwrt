name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler help2man

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DTS, device and patch
        run: |
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/
          # Insert device definition BEFORE BuildImage eval
          python3 -c "
import sys
with open('openwrt/target/linux/econet/image/en7528.mk') as f: content = f.read()
with open('dts/en7528-ha030wc.mk') as f: dev = f.read()
content = content.replace('\$(eval \$(call BuildImage))', dev + '\n\$(eval \$(call BuildImage))')
with open('openwrt/target/linux/econet/image/en7528.mk','w') as f: f.write(content)
"
          # Install the ustream-ssl CMakeLists patch
          mkdir -p openwrt/package/libs/ustream-ssl/patches
          cp patches/100-find-mbedtls.patch openwrt/package/libs/ustream-ssl/patches/
          echo "=== Patch installed ==="
          cat openwrt/package/libs/ustream-ssl/patches/100-find-mbedtls.patch

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_libc=y
          CONFIG_PACKAGE_kernel=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make tools/install -j$(nproc)
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
