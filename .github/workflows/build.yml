name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom overlay + DTS
        run: |
          # 覆盖自定义文件（AP配置 + 极简网页 + MAC脚本）
          rm -rf openwrt/files
          cp -r files openwrt/files

          # 安装设备树
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/

          # 追加设备定义到 en7528.mk
          cat dts/en7528-ha030wc.mk >> openwrt/target/linux/econet/image/en7528.mk

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_GENERIC=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=n
          CONFIG_PACKAGE_luci=n
          CONFIG_PACKAGE_uci=y
          # 2.4G WiFi (MT7603)
          CONFIG_PACKAGE_kmod-mt7603=y
          # 5G WiFi (MT7663 → mt7615e 驱动)
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7663-firmware-ap=y
          # WiFi
          CONFIG_PACKAGE_wpad-mbedtls=y
          # 精简：纯AP不需要PPP/DHCPv6
          CONFIG_PACKAGE_odhcp6c=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_ppp=n
          CONFIG_PACKAGE_kmod-ppp=n
          CONFIG_PACKAGE_kmod-pppoe=n
          # 减小内核体积
          CONFIG_KERNEL_KALLSYMS=n
          CONFIG_KERNEL_DEBUG_INFO=n
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
