name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler help2man

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DTS and device
        run: |
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/
          cat dts/en7528-ha030wc.mk >> openwrt/target/linux/econet/image/en7528.mk

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make download -j8
          # Build host tools and toolchain first
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # Unpack ustream-ssl source and patch CMakeLists.txt
          make package/libs/ustream-ssl/prepare V=s
          USL_CMAKE=$(find build_dir -name "CMakeLists.txt" -path "*ustream-ssl*" 2>/dev/null | head -1)
          echo "Patching: $USL_CMAKE"
          STAGING_LIB="$PWD/staging_dir/target-mipsel_24kc_musl/usr/lib"
          sed -i "s|FIND_LIBRARY(mbedtls_library mbedtls)|FIND_LIBRARY(mbedtls_library mbedtls PATHS $STAGING_LIB NO_DEFAULT_PATH)|" "$USL_CMAKE"
          sed -i "s|FIND_LIBRARY(mbedx509_library mbedx509)|FIND_LIBRARY(mbedx509_library mbedx509 PATHS $STAGING_LIB NO_DEFAULT_PATH)|" "$USL_CMAKE"
          sed -i "s|FIND_LIBRARY(mbedcrypto_library mbedcrypto)|FIND_LIBRARY(mbedcrypto_library mbedcrypto PATHS $STAGING_LIB NO_DEFAULT_PATH)|" "$USL_CMAKE"
          echo "=== Patched ==="
          grep FIND_LIBRARY "$USL_CMAKE" | grep -i mbed
          # Build everything
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
