name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler help2man

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DTS, device and ustream-ssl fix
        run: |
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/
          cat dts/en7528-ha030wc.mk >> openwrt/target/linux/econet/image/en7528.mk

          # 1. Patch the package Makefile to pass STAGING_DIR as CMake var
          PKG_MK=openwrt/package/libs/ustream-ssl/Makefile
          sed -i '/include $(INCLUDE_DIR)\/package.mk/i CMAKE_OPTIONS += -DSTAGING_DIR=$(STAGING_DIR)' $PKG_MK
          echo "=== Makefile patched ==="
          grep CMAKE $PKG_MK

          # 2. Drop a patch for CMakeLists.txt to use STAGING_DIR
          mkdir -p openwrt/package/libs/ustream-ssl/patches
          cat > openwrt/package/libs/ustream-ssl/patches/100-find-mbedtls.patch <<'PATCHEOF'
          --- a/CMakeLists.txt
          +++ b/CMakeLists.txt
          @@ -18,9 +18,9 @@
           IF(MBEDTLS)
             ADD_DEFINITIONS(-DHAVE_MBEDTLS)
             SET(SSL_SRC ustream-mbedtls.c)
          -  FIND_LIBRARY(mbedtls_library mbedtls)
          -  FIND_LIBRARY(mbedx509_library mbedx509)
          -  FIND_LIBRARY(mbedcrypto_library mbedcrypto)
          +  FIND_LIBRARY(mbedtls_library mbedtls PATHS ${STAGING_DIR}/usr/lib NO_DEFAULT_PATH)
          +  FIND_LIBRARY(mbedx509_library mbedx509 PATHS ${STAGING_DIR}/usr/lib NO_DEFAULT_PATH)
          +  FIND_LIBRARY(mbedcrypto_library mbedcrypto PATHS ${STAGING_DIR}/usr/lib NO_DEFAULT_PATH)
             SET(SSL_LIB ${mbedtls_library} ${mbedx509_library} ${mbedcrypto_library} m)
          ELSEIF(WOLFSSL)
          PATCHEOF
          echo "=== CMakeLists patch created ==="

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make tools/install -j$(nproc)
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
