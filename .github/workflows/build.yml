name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler help2man

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DTS and device
        run: |
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/
          cat dts/en7528-ha030wc.mk >> openwrt/target/linux/econet/image/en7528.mk

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          EOF
          make defconfig

      - name: Patch ustream-ssl to fix mbedtls CMake
        run: |
          cd openwrt
          # Patch the package Makefile to add CMAKE_FIND_ROOT_PATH
          PKG_MK=package/libs/ustream-ssl/Makefile
          echo "=== Before patch ==="
          cat $PKG_MK
          # Add CMAKE_OPTIONS to find mbedtls in staging dir
          sed -i '/include $(INCLUDE_DIR)\/package.mk/i CMAKE_OPTIONS += -DCMAKE_FIND_ROOT_PATH=$(STAGING_DIR)/usr -DCMAKE_PREFIX_PATH=$(STAGING_DIR)/usr' $PKG_MK
          echo "=== After patch ==="
          grep CMAKE $PKG_MK

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
