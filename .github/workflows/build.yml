name: Build HA030WC OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev device-tree-compiler help2man

      - name: Clone OpenWrt
        run: |
          git clone -b main --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DTS, device and patch
        run: |
          cp dts/en7528_nokia_ha030wc.dts openwrt/target/linux/econet/dts/
          chmod +x apply_device.sh && ./apply_device.sh
          mkdir -p openwrt/package/libs/ustream-ssl/patches
          cp patches/100-find-mbedtls.patch openwrt/package/libs/ustream-ssl/patches
          echo "=== en7528.mk tail ==="
          tail -20 openwrt/target/linux/econet/image/en7528.mk

      - name: Configure and debug
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en7528=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_econet_en7528_nokia_ha030wc=y
          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_libc=y
          CONFIG_PACKAGE_kernel=y
          EOF
          make defconfig
          echo "=== Available devices ==="
          make TARGET_PER_DEVICE_ROOTFS=1 DEVICE_TITLE=1 info 2>/dev/null | grep -i "nokia\|ha030" || echo "Device not found in make info!"
          echo "=== Config device lines ==="
          grep "TARGET_DEVICE" .config

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make tools/install -j$(nproc)
          make -j$(nproc) V=s

      - name: List output
        run: ls -lh openwrt/bin/targets/econet/en7528/

      - uses: actions/upload-artifact@v4
        with:
          name: ha030wc-openwrt
          path: openwrt/bin/targets/econet/en7528/
          if-no-files-found: warn
